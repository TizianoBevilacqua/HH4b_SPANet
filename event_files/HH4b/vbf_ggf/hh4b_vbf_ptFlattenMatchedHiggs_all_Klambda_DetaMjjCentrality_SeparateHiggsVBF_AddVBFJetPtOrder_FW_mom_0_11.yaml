# ---------------------------------------------------
# REQUIRED - INPUTS - List all inputs to SPANet here.
# ---------------------------------------------------
INPUTS:
  # -----------------------------------------------------------------------------
  # REQUIRED - SEQUENTIAL - inputs which can have an arbitrary number of vectors.
  # -----------------------------------------------------------------------------
  SEQUENTIAL:
    JetHiggs:
      pt: log_normalize
      eta: normalize
      phi: normalize
      btagPNetB_5wp: none
    JetVBF:
      pt: log_normalize
      eta: normalize
      phi: normalize
      btagPNetB_5wp: none

  # ---------------------------------------------------------------------
  # REQUIRED - GLOBAL - inputs which will have a single vector per event.
  # ---------------------------------------------------------------------
  GLOBAL:
    Event:
      centralityHiggsLeadingJetTotalSPANetPadded: none
      centralityHiggsSubLeadingJetTotalSPANetPadded: none
      detaJetGoodVBFMergedProvVBFPadded: none
      mjjJetTotalSPANetPadded: none
      FW_H0_W_T: none
      FW_H0_W_s: none
      FW_H0_W_z: none
      FW_H1_W_T: none
      FW_H1_W_s: none
      FW_H1_W_z: none
      FW_H2_W_T: none
      FW_H2_W_s: none
      FW_H2_W_z: none
      FW_H3_W_T: none
      FW_H3_W_s: none
      FW_H3_W_z: none
      FW_H4_W_T: none
      FW_H4_W_s: none
      FW_H4_W_z: none
      FW_H5_W_T: none
      FW_H5_W_s: none
      FW_H5_W_z: none
      FW_H6_W_T: none
      FW_H6_W_s: none
      FW_H6_W_z: none
      FW_H7_W_T: none
      FW_H7_W_s: none
      FW_H7_W_z: none
      FW_H8_W_T: none
      FW_H8_W_s: none
      FW_H8_W_z: none
      FW_H9_W_T: none
      FW_H9_W_s: none
      FW_H9_W_z: none
      FW_H10_W_T: none
      FW_H10_W_s: none
      FW_H10_W_z: none
      FW_H11_W_T: none
      FW_H11_W_s: none
      FW_H11_W_z: none

# ----------------------------------------------------------------------
# REQUIRED - EVENT - Complete list of resonance particles and daughters.
# ----------------------------------------------------------------------
EVENT:
  h1:
    - b1: JetHiggs
    - b2: JetHiggs
  h2:
    - b1: JetHiggs
    - b2: JetHiggs
  vbf:
    - q1: JetVBF
    - q2: JetVBF

# ---------------------------------------------------------
# REQUIRED KEY - PERMUTATIONS - List of valid permutations.
# ---------------------------------------------------------
PERMUTATIONS:
  EVENT:
    - [h1, h2]
  h1:
    - [b1, b2]
  h2:
    - [b1, b2]
  vbf:
    - [q1, q2]

# ------------------------------------------------------------------------------
# REQUIRED - REGRESSIONS - List of desired features to regress from observables.
# ------------------------------------------------------------------------------
REGRESSIONS:

# -----------------------------------------------------------------------------
# REQUIRED - REGRESSIONS - List of desired classes to predict from observables.
# -----------------------------------------------------------------------------
CLASSIFICATIONS:
  EVENT:
    - class
